<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex justify-content-center align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow p-4">
                    <h3 class="text-center">관리자 로그인</h3>
                    <form action="/admlogin" method="post">
                        <div class="mb-3">
                            <label for="adminId" class="form-label">아이디</label>
                            <input type="text" class="form-control" id="adminId" name="id" required>
                        </div>
                        <div class="mb-3">
                            <label for="adminPassword" class="form-label">비밀번호</label>
                            <input type="password" class="form-control" id="adminPassword" name="pw" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">로그인</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
