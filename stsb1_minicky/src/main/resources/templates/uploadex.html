<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>uploadEx</title>
</head>

<body>
	<input name="uploadFiles" type="file" multiple>
	<button class="uploadBtn">Upload</button>

	<div class="uploadResult"></div>

	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>


	<!--upload btn-->
	<script>

		$('.uploadBtn').click(() => {

            const formData = new FormData();

            const inputFile = $("input[type='file']");

			const files = inputFile[0].files;

            for(let i = 0; i < files.length; i++) {
                console.log(files[i]);
                formData.append("uploadFiles", files[i]);
			}

			const showUploadedImages = arr => {
                console.log(arr);

                const divArea = $(".uploadResult");

                for(let i = 0; i<arr.length; i++){
                    divArea.append("<img src='/display?fileName="+arr[i].imageURL+"' alt='..null'>");
				}
			}

			//실제 업로드 부분
	        //upload ajax
	        $.ajax({
	            url: '/uploadAjax',
	            processData: false,
	            contentType: false, //파일 업로드를 위해서는 contentType 속성이 반드시 false여야 한다.
	            //이는 'multipart/form-data'타입을 사용하기 위함이다.
	            data: formData,
	            type:'POST',
	            dataType:'json',
	            success: function(result){
	                console.log(result);
	                showUploadedImages(result);
	     
	            }, error: function(jqXHR, textStatus, errorThrown){

	                console.log(textStatus);
	            }
	        });

		})

	</script>

</body>
</html>
