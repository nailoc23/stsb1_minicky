spring.application.name=stsb1_minicky

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/javadb3?serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=mysql

# mybatis + spring + mysql
mybatis.mapper-locations=classpath:mappers/*.xml
mybatis.type-aliases-package=com.touzone.stsb.dao

# file upload
spring.servlet.multipart.enabled=true
## file size per 1
spring.servlet.multipart.max-file-size=10MB
## total max size
spring.servlet.multipart.max-request-size=50MB
## path
## project.uploadpath=D:\\upload
